name: Nightly (G3 — property tests + E2E + external smoke)

on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  property:
    name: Property tests (Hypothesis, W3C translators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run property-based tests
        env:
          DATABRICKS_HOST: https://test.databricks.com
          DATABRICKS_TOKEN: test-token
          DATABRICKS_SQL_WAREHOUSE_ID: test-warehouse
          SECRET_KEY: test-secret-key
        run: |
          uv run pytest tests/ -m property -v --tb=short \
            --hypothesis-seed=0 \
            --hypothesis-show-statistics

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run E2E suite
        env:
          DATABRICKS_HOST: https://test.databricks.com
          DATABRICKS_TOKEN: test-token
          DATABRICKS_SQL_WAREHOUSE_ID: test-warehouse
          SECRET_KEY: test-secret-key
        run: uv run pytest tests/e2e/ -m e2e -v --tb=short

  external-smoke:
    name: External smoke probe (fevm-ontobricks-int)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # External tier — only on schedule, never on PR. Requires repository secrets.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      # The integration test environment, per project §5/§9 of the methodology plan.
      ONTOBRICKS_INT_URL: https://fevm-ontobricks-int.cloud.databricks.com
      DATABRICKS_HOST: ${{ secrets.ONTOBRICKS_INT_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.ONTOBRICKS_INT_TOKEN }}
      DATABRICKS_SQL_WAREHOUSE_ID: ${{ secrets.ONTOBRICKS_INT_WAREHOUSE_ID }}
      SECRET_KEY: ${{ secrets.ONTOBRICKS_INT_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Smoke probe against integration workspace
        run: |
          # Probe MCP server health endpoint + a representative tool call.
          # If the workspace isn't reachable or auth fails, the run is reported but no PR is gated.
          uv run pytest tests/ -m external -v --tb=short \
            --ignore=tests/external/test_mv_incremental_plan.py \
            --ignore=tests/external/test_incremental_readiness_live.py \
            --ignore=tests/external/test_freshness_slo.py \
            || echo "external probe failed (non-blocking)"

      # Blocking (unlike the probe above): a _data view that no longer plans an
      # incremental refresh is a regression, so this step fails the job and the
      # open-issue-on-failure job files it. Skipped when the secrets are absent.
      - name: EXPLAIN check of the incremental _data view
        if: env.DATABRICKS_HOST != '' && env.DATABRICKS_TOKEN != '' && env.DATABRICKS_SQL_WAREHOUSE_ID != ''
        env:
          # A schema the integration token may create tables in.
          ONTOBRICKS_EXTERNAL_WAREHOUSE: "1"
          ONTOBRICKS_EXTERNAL_SCHEMA: ${{ vars.ONTOBRICKS_INT_EXTERNAL_SCHEMA || 'main.ontobricks_it' }}
        run: |
          set +e  # the default shell is -eo pipefail: keep going to write the summary
          uv run pytest tests/external/test_mv_incremental_plan.py \
            tests/external/test_incremental_readiness_live.py -m external -v --tb=short -rs \
            | tee explain-check.log
          status=${PIPESTATUS[0]}
          {
            echo "### EXPLAIN check of the incremental _data view"
            echo '```'
            tail -n 20 explain-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Incremental _data view::EXPLAIN no longer plans an incremental refresh (see the step summary)"
          fi
          exit "$status"

      # Non-blocking: the freshness / drift KPIs of the integration domain named by
      # the ONTOBRICKS_INT_FRESHNESS_* repository variables (scripts/measure_freshness.py,
      # docs/incremental-materialization.md#verification). A missed SLO is a warning
      # and a step summary, never a failed job. Skipped without the domain.
      - name: Freshness and drift of the integration domain (non-blocking)
        if: env.DATABRICKS_HOST != '' && env.DATABRICKS_TOKEN != '' && env.DATABRICKS_SQL_WAREHOUSE_ID != '' && vars.ONTOBRICKS_INT_FRESHNESS_STEM != ''
        continue-on-error: true
        env:
          ONTOBRICKS_EXTERNAL_WAREHOUSE: "1"
          ONTOBRICKS_FRESHNESS_STEM: ${{ vars.ONTOBRICKS_INT_FRESHNESS_STEM }}
          ONTOBRICKS_FRESHNESS_MODE: ${{ vars.ONTOBRICKS_INT_FRESHNESS_MODE || 'microbatch' }}
          ONTOBRICKS_FRESHNESS_SOURCE_TABLE: ${{ vars.ONTOBRICKS_INT_FRESHNESS_SOURCE_TABLE }}
          ONTOBRICKS_FRESHNESS_KEY_COLUMN: ${{ vars.ONTOBRICKS_INT_FRESHNESS_KEY_COLUMN }}
          ONTOBRICKS_FRESHNESS_KEY_VALUE: ${{ vars.ONTOBRICKS_INT_FRESHNESS_KEY_VALUE }}
          ONTOBRICKS_FRESHNESS_VALUE_COLUMN: ${{ vars.ONTOBRICKS_INT_FRESHNESS_VALUE_COLUMN }}
          # The probe rewrites one row: only a fixture table (default *ob_it_*,*fixture*).
          ONTOBRICKS_FRESHNESS_ALLOW_PATTERN: ${{ vars.ONTOBRICKS_INT_FRESHNESS_ALLOW_PATTERN }}
          # The Lakehouse//RT query warehouse (repository variable) and the Lakebase
          # libpq DSN (repository secret); the paths default from the mode, so a
          # realtime domain also polls _live (ONTOBRICKS_INT_FRESHNESS_LIVE_TABLE).
          ONTOBRICKS_FRESHNESS_READ_WAREHOUSE_ID: ${{ vars.ONTOBRICKS_INT_RT_WAREHOUSE_ID }}
          ONTOBRICKS_FRESHNESS_PG_DSN: ${{ secrets.ONTOBRICKS_INT_LAKEBASE_DSN }}
          ONTOBRICKS_FRESHNESS_SYNC_TABLE: ${{ vars.ONTOBRICKS_INT_FRESHNESS_SYNC_TABLE }}
          ONTOBRICKS_FRESHNESS_LIVE_TABLE: ${{ vars.ONTOBRICKS_INT_FRESHNESS_LIVE_TABLE }}
          ONTOBRICKS_FRESHNESS_REPORT: freshness-report.md
        run: |
          set +e  # keep going to write the summary
          uv run pytest tests/external/test_freshness_slo.py -m external -v --tb=short -rs \
            | tee freshness.log
          status=${PIPESTATUS[0]}
          {
            echo "### Freshness and drift (non-blocking)"
            if [ -f freshness-report.md ]; then cat freshness-report.md; fi
            echo '```'
            tail -n 20 freshness.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Freshness SLO::a freshness or drift SLO was missed (see the step summary)"
          fi
          exit "$status"

  open-issue-on-failure:
    name: Open issue on regression
    runs-on: ubuntu-latest
    needs: [property, e2e, external-smoke]
    if: failure()
    steps:
      - uses: actions/checkout@v7
      - name: Create or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label nightly-failure --state open --json number --jq '.[0].number' > /tmp/issue || true
          if [ -s /tmp/issue ]; then
            num=$(cat /tmp/issue)
            gh issue comment "$num" --body "Nightly run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --label nightly-failure \
              --title "Nightly tests failed ($(date -u +%Y-%m-%d))" \
              --body "Failure: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
