<!-- OWL tab body (General section) — JS: /static/ontology/js/ontology-owl-content.js -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h5 class="mb-1"><i class="bi bi-file-earmark-code me-2"></i>OWL Content (Turtle Format)</h5>
        <p class="text-muted mb-0 small">Generated OWL representation of your ontology</p>
    </div>
    <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn btn-sm btn-outline-secondary" id="copyOwl">
            <i class="bi bi-clipboard me-1"></i> Copy
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="downloadOwl">
            <i class="bi bi-download me-1"></i> Download
        </button>
        <button type="button" class="btn btn-sm btn-outline-primary" id="regenerateOwl" title="Regenerate OWL from current ontology">
            <i class="bi bi-arrow-clockwise me-1"></i> Regenerate
        </button>
    </div>
</div>
<div id="owlStatusMessage" class="alert alert-info d-none mb-2">
    <i class="bi bi-info-circle"></i> <span id="owlStatusText"></span>
</div>
<textarea class="form-control font-monospace ob-code-editor-surface" id="owlPreview" readonly
          placeholder="OWL will be generated automatically when you add entities or relationships..."></textarea>
