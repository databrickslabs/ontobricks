<!--
    Cohort Discovery — Runs tab body (Intelligence → Configuration → Cohorts).

    Header actions (Purge, Outputs, Preview, Materialise) and the shared
    saved-rules rail live in partials/ontology/_ontology_cohorts.html.
    This pane shows the selected rule, its preview and the diagnostics.
-->
<div class="cohort-run-pane">

    <!-- Selected rule summary (auto-populated when a rule is picked) -->
    <div id="cohortRuleSummary" class="cohort-rule-summary mb-3"></div>

    <!-- Preview results -->
    <div id="cohortPreviewBody">
        <div class="text-muted small fst-italic py-3">
            Pick a rule from the left pane and click <em>Preview</em>.
        </div>
    </div>

    <!-- Path trace diagnostic -->
    <div class="cohort-preview-trace mt-3 pt-3 border-top">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label small fw-semibold mb-0">
                <i class="bi bi-bug me-1"></i>
                Path trace
                <span class="text-muted fw-normal ms-1">
                    — see which hop empties the walk
                </span>
            </label>
            <button class="btn btn-sm btn-outline-secondary"
                    onclick="CohortModule.tracePaths()">
                <i class="bi bi-activity me-1"></i>Trace path
            </button>
        </div>
        <div id="cohortTraceResult" class="small"></div>
    </div>

    <div class="cohort-preview-explain mt-3 pt-3 border-top">
        <label class="form-label small fw-semibold mb-1">
            <i class="bi bi-question-circle me-1"></i>
            Why didn't a member end up in a cohort?
        </label>
        <div class="input-group input-group-sm">
            <input type="text" class="form-control" id="cohortExplainTarget"
                   placeholder="Paste an entity URI…">
            <button class="btn btn-outline-secondary" onclick="CohortModule.explain()">
                Explain
            </button>
        </div>
        <div id="cohortExplainResult" class="mt-2 small"></div>
    </div>

</div>
