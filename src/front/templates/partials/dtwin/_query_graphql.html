<div class="query-pane-toolbar d-flex justify-content-end align-items-center gap-2">
    <div class="d-flex align-items-center gap-1 d-none"
         id="graphqlDepthControl"
         title="Relationship traversal depth">
        <label for="graphqlDepthSelect"
               class="form-label mb-0 small text-muted">Depth</label>
        <select id="graphqlDepthSelect"
                class="form-select form-select-sm graphql-depth-select"></select>
    </div>
    <button type="button"
            class="btn btn-sm btn-outline-secondary d-none"
            id="graphqlOpenNewTab"
            title="Open in new tab">
        <i class="bi bi-box-arrow-up-right me-1"></i>New tab
    </button>
</div>

<div id="graphqlLoading" class="text-center py-5 d-none">
    <div class="spinner-border spinner-border-sm text-primary" role="status">
        <span class="visually-hidden">Loading GraphiQL…</span>
    </div>
    <div class="text-muted mt-2">Loading GraphQL schema…</div>
</div>

<div id="graphqlError" class="alert alert-danger d-none" role="alert">
    <i class="bi bi-x-circle me-2"></i>
    <span id="graphqlErrorMsg"></span>
</div>

<div id="graphiql-container" class="d-none"></div>
