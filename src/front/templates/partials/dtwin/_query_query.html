<div class="section-header d-flex justify-content-between align-items-center mb-2">
    <div>
        <h4 class="mb-1">
            <i class="bi bi-braces-asterisk me-2"></i>Query
            {% include "partials/dtwin/_kg_status_indicator.html" %}
        </h4>
        <p class="text-muted mb-0 small">
            Query the current Knowledge Graph with GraphQL or SPARQL
        </p>
    </div>
    <div class="d-flex align-items-center gap-2">
        <button type="button"
                class="btn btn-sm btn-outline-primary"
                data-query-action="ontology"
                title="View ontology model">
            <i class="bi bi-bezier2"></i> Ontology
        </button>
        <button type="button"
                class="btn btn-sm btn-outline-primary onto-discuss-btn"
                data-query-action="discussion"
                title="Open the Knowledge Graph discussion">
            <i class="bi bi-chat-dots"></i>
        </button>
    </div>
</div>

<ul class="nav nav-tabs ob-tabs ob-tabs--compact query-language-tabs"
    id="queryLanguageTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active"
                id="queryGraphqlTab"
                data-bs-toggle="tab"
                data-bs-target="#queryGraphqlPane"
                type="button" role="tab"
                aria-controls="queryGraphqlPane"
                aria-selected="true">
            GraphQL
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link"
                id="querySparqlTab"
                data-bs-toggle="tab"
                data-bs-target="#querySparqlPane"
                type="button" role="tab"
                aria-controls="querySparqlPane"
                aria-selected="false">
            SPARQL
        </button>
    </li>
</ul>

<div class="tab-content query-language-content">
    <div class="tab-pane fade show active"
         id="queryGraphqlPane"
         role="tabpanel"
         aria-labelledby="queryGraphqlTab">
        {% include "partials/dtwin/_query_graphql.html" %}
    </div>
    <div class="tab-pane fade"
         id="querySparqlPane"
         role="tabpanel"
         aria-labelledby="querySparqlTab">
        {% include "partials/dtwin/_query_sparql.html" %}
    </div>
</div>
