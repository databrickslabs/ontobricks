<!-- Runs Section - simulation run history for the active domain version -->
<div class="content-section">
    <div class="section-header d-flex justify-content-between align-items-center mb-4">
        <div class="me-auto">
            <h4 class="mb-1"><i class="bi bi-list-check me-2"></i>Runs</h4>
            <p class="text-muted mb-0 small">History of simulation runs on this domain version.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="simRunsRefreshBtn" title="Refresh">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-sm table-hover align-middle mb-0 sim-table">
                    <thead>
                        <tr>
                            <th>Started</th>
                            <th>Scenario</th>
                            <th>Status</th>
                            <th>Outcome</th>
                            <th class="text-end">Duration</th>
                            <th>By</th>
                        </tr>
                    </thead>
                    <tbody id="simRunsBody">
                        <tr><td colspan="6" class="text-center text-muted py-4">Loading runs…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
