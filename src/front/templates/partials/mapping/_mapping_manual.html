<!-- Mapping Studio → List tab body (tree only). The mapping pane is shared
     with Visual (`#mappingRightPanel` in `_mapping_design.html`).
     JS: /static/mapping/js/mapping-manual.js
     CSS: /static/mapping/css/mapping-manual.css -->
<div id="mappingStudioListRoot" class="h-100 d-flex flex-column">
    <div class="d-flex align-items-center justify-content-between gap-2 px-3 pt-3 pb-2 flex-shrink-0">
        <p class="text-muted small mb-0">View mapping status by category. Click an item to configure its mapping.</p>
        <div class="d-flex gap-2 flex-shrink-0">
            <div class="btn-group btn-group-sm" role="group" aria-label="List expand collapse">
                <button type="button" class="btn btn-outline-secondary" data-action="manual-expand-all" title="Expand All" aria-label="Expand all">
                    <i class="bi bi-arrows-expand"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary" data-action="manual-collapse-all" title="Collapse All" aria-label="Collapse all">
                    <i class="bi bi-arrows-collapse"></i>
                </button>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary" data-action="manual-refresh" title="Refresh list">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>
    <div class="flex-grow-1 min-h-0 overflow-auto" id="manual-container">
        <div id="manualAssignmentTree" class="px-3 pb-3">
            <div class="text-muted small">Loading...</div>
        </div>
    </div>
</div>
