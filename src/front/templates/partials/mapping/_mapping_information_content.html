<!-- Mapping Studio → Informations tab body (prerequisites, summary KPI tiles, gauges, status, detail lists). -->

<!-- Prerequisite: Data Sources Check -->
<div class="alert alert-secondary" id="metadataPrerequisite" role="alert">
    <div class="d-flex align-items-center justify-content-between">
        <div>
            <span id="metadataCheckIcon"><i class="bi bi-database me-2"></i></span>
            <strong>Data Assets:</strong>
            <span id="metadataCheckStatus">Checking...</span>
        </div>
        <a href="/domain/?section=metadata" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-database"></i> Data Assets
        </a>
    </div>
</div>

<!-- Prerequisite: Ontology Check -->
<div class="alert alert-secondary" id="ontologyPrerequisite" role="alert">
    <div class="d-flex align-items-center justify-content-between">
        <div>
            <span id="ontologyCheckIcon"><i class="bi bi-diagram-3 me-2"></i></span>
            <strong>Ontology:</strong>
            <span id="ontologyCheckStatus">Checking...</span>
        </div>
        <a href="/ontology/" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-diagram-3"></i> Ontology Page
        </a>
    </div>
</div>

<!-- Mapping Summary Tiles + Gauges -->
<div class="row g-3 mb-4">
    <div class="col">
        <div class="ob-kpi-tile">
            <div class="ob-kpi-tile-icon"><i class="bi bi-box"></i></div>
            <canvas id="gaugeMapEntities" width="130" height="72"></canvas>
            <div class="small text-muted mt-1"><span id="entityMappingCount">0 / 0</span></div>
            <div class="ob-kpi-tile-label">Entities Mapped</div>
        </div>
    </div>
    <div class="col">
        <div class="ob-kpi-tile">
            <div class="ob-kpi-tile-icon"><i class="bi bi-tags"></i></div>
            <canvas id="gaugeMapAttributes" width="130" height="72"></canvas>
            <div class="small text-muted mt-1"><span id="attributeMappingCount">0 / 0</span></div>
            <div class="ob-kpi-tile-label">Attributes Mapped</div>
        </div>
    </div>
    <div class="col">
        <div class="ob-kpi-tile">
            <div class="ob-kpi-tile-icon"><i class="bi bi-arrow-left-right"></i></div>
            <canvas id="gaugeMapRelationships" width="130" height="72"></canvas>
            <div class="small text-muted mt-1"><span id="relationshipMappingCount">0 / 0</span></div>
            <div class="ob-kpi-tile-label">Relationships Mapped</div>
        </div>
    </div>
</div>

<!-- Status -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <div id="mappingStatusMessage" class="text-muted small">
        <i class="bi bi-info-circle"></i> Load or create entity and relationship to get started.
    </div>
    <span id="mappingStatusBadge" class="badge bg-secondary">Not Started</span>
</div>

<!-- Detail Lists: Entities & Relationships -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row" id="summaryDetailGrid">
            <div class="col-md-6">
                <h6 class="text-muted mb-2"><i class="bi bi-box"></i> Entities</h6>
                <div class="summary-detail-list" id="entityDetailList">
                    <div class="text-muted small fst-italic">No ontology loaded</div>
                </div>
            </div>
            <div class="col-md-6">
                <h6 class="text-muted mb-2"><i class="bi bi-arrow-left-right"></i> Relationships</h6>
                <div class="summary-detail-list" id="relationshipDetailList">
                    <div class="text-muted small fst-italic">No ontology loaded</div>
                </div>
            </div>
        </div>
    </div>
</div>
