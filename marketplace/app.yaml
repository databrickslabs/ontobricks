# OntoBricks: Databricks Apps config for MARKETPLACE installs (0.10.x).
#
# Static: Marketplace runs this file verbatim (no render step). The DAB
# deploy path uses ../app.yaml.template instead; the two are kept in sync
# by tests/units/scripts/test_marketplace_package.py.
#
# Resources are declared in ./manifest.yaml and bound by the installer. For
# the Lakebase `postgres` resource the Apps platform injects
# PGHOST/PGPORT/PGDATABASE/PGUSER (no valueFrom needed).

command:
  - "uv"
  - "run"
  - "--frozen"
  - "--no-dev"
  - "--extra"
  - "lakebase"
  - "python"
  - "run.py"

env:
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # The Postgres schema is not injected with the database binding, so it is
  # pinned to the Settings default.
  - name: LAKEBASE_SCHEMA
    value: "ontobricks_registry"
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: ONTOBRICKS_DTWIN_CHAT_MAX_TOKENS
    value: "8192"
  - name: ONTOBRICKS_ANALYTICS_TOP_N
    value: "100"
  # The graph-analytics job is bundle-deployed and not part of a Marketplace
  # install, so the Analytics page stays disabled (it names the missing job).
  - name: ONTOBRICKS_ANALYTICS_JOB_ENABLED
    value: "false"
  - name: ONTOBRICKS_ANALYTICS_JOB_NAME
    value: ""
  - name: ONTOBRICKS_COMMUNITY_JOB_NAME
    value: ""
  - name: ONTOBRICKS_PATTERN_JOB_NAME
    value: ""
  - name: ONTOBRICKS_ANALYTICS_JOB_PAGERANK_ITERATIONS
    value: "20"
  - name: ONTOBRICKS_ANALYTICS_JOB_PIVOTS
    value: "64"

# Mirrors manifest.yaml user_api_scopes (Marketplace installs read the manifest).
authorization:
  user:
    scopes:
      - sql
      - apps
