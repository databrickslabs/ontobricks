# Per-agent eval thresholds — read by tests/eval/run_<agent>.py and
# .github/workflows/eval-gate.yml.
#
# Values match the proposed thresholds in each agent's SPEC.md
# (.planning/agents/<agent>/SPEC.md §5). Calibrate after baseline runs.

owl_generator:
  schema_validity: 0.95
  class_coverage: 0.80
  property_quality: 0.80
  parsed_corpus_contract: 0.90
  # Staged-contract aggregate (SPEC §5). Now enforceable: the staged entry
  # points (detect_entities / infer_relations / infer_attributes /
  # infer_axioms) exist, so tests/eval/staged_contract.py scores every
  # `staged` row's constraints deterministically against the real code.
  staged_contract: 0.95
  latency_p95_seconds: 30.0
  cost_per_call_usd: 0.05
  aggregate: 0.82

ontology_assistant:
  relevance: 0.85
  groundedness: 0.80
  tool_selection: 0.90
  latency_p95_seconds: 8.0
  cost_per_call_usd: 0.02
  aggregate: 0.82

auto_assignment:
  icon_exact_match: 0.92
  layout_no_overlap: 0.98
  f1_class_coverage: 0.95
  latency_p95_seconds: 4.0
  cost_per_call_usd: 0.01
  # Contract checks on the live-trace / audit-report surface (SPEC §3.1).
  # Pass/fail, excluded from the weighted aggregate below.
  trace_step_order: 1.0
  audit_report_parity: 1.0
  aggregate: 0.90

auto_icon_assign:
  top1_accuracy: 0.85
  top3_accuracy: 0.95
  latency_p95_seconds: 2.5
  cost_per_call_usd: 0.005
  aggregate: 0.85

dtwin_chat:
  groundedness: 0.85
  factuality: 0.90
  tool_selection: 0.85
  relevance: 0.90
  latency_p95_seconds: 15.0
  cost_per_call_usd: 0.04
  aggregate: 0.85

cohort:
  rule_validity: 0.95
  tool_selection: 0.85
  cohort_quality: 0.80
  dry_run_calls: 0.98
  latency_p95_seconds: 30.0
  cost_per_call_usd: 0.05
  aggregate: 0.82

graph_interpreter:
  section_completeness: 1.00
  groundedness: 0.85
  tool_selection: 0.70
  latency_p95_seconds: 20.0
  cost_per_call_usd: 0.02
  aggregate: 0.82

mapping_pge:
  entity_coverage: 1.00
  relationship_coverage: 1.00
  dangling_rate: 1.00
  sql_executes: 0.98
  semantic_correctness: 0.85
  parsed_corpus_contract: 0.90
  # Metric-view SQL-generation contract (SPEC §5). Scored by
  # run_agent_mapping_pge_metric.py against datasets/.../metric_view.jsonl.
  metric_view_sql_correctness: 0.95
  aggregate: 0.90
