# Serverless job discovering egocentric neighbourhood patterns for a typed
# anchor class. Same script as the graph-analytics / community jobs
# (``--task patterns``); separate job because each allows one run at a time.
#
# Reads the R2RML-mapped Delta snapshot (``…_data``) and writes five tables
# the app reads back (``<out>``, ``_shapes``, ``_preview_nodes``,
# ``_preview_edges``, ``_summary``). Triggered on demand by ``LakeflowRunner``;
# no schedule. The app service principal needs CAN_MANAGE_RUN, granted by
# ``scripts/bootstrap/app-permissions.sh``.

resources:
  jobs:
    pattern_detection_job:
      name: "${var.app_name}-pattern-detection"
      description: "OntoBricks: knowledge-graph pattern discovery (egocentric signatures)"

      email_notifications:
        on_failure:
          - "${workspace.current_user.userName}"

      # The app polls a single run, and a second concurrent run would fight
      # over the same output tables.
      max_concurrent_runs: 1

      environments:
        - environment_key: default
          spec:
            client: "3"

      tasks:
        - task_key: detect_patterns
          environment_key: default
          spark_python_task:
            python_file: "${workspace.file_path}/src/jobs/graph_analytics_job.py"
            parameters:
              - "--task"
              - "patterns"
              - "--source-table"
              - "{{job.parameters.source_table}}"
              - "--output-table"
              - "{{job.parameters.output_table}}"
              - "--exclude-predicates"
              - "{{job.parameters.exclude_predicates}}"
              - "--class-filter"
              - "{{job.parameters.class_filter}}"
              - "--pattern-hops"
              - "{{job.parameters.pattern_hops}}"
              - "--pattern-bins"
              - "{{job.parameters.pattern_bins}}"
              - "--pattern-min-support"
              - "{{job.parameters.pattern_min_support}}"
              - "--pattern-frontier"
              - "{{job.parameters.pattern_frontier}}"
              - "--refine-top"
              - "{{job.parameters.refine_top}}"
              - "--computed-at"
              - "{{job.parameters.computed_at}}"

      parameters:
        - name: source_table
          default: ""
        - name: output_table
          default: ""
        - name: exclude_predicates
          default: ""
        - name: class_filter
          default: ""
        - name: pattern_hops
          default: "3"
        - name: pattern_bins
          default: "8"
        - name: pattern_min_support
          default: "3"
        - name: pattern_frontier
          default: "50000"
        - name: refine_top
          default: "0"
        - name: computed_at
          default: ""
