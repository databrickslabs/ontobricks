# Realtime triple stream (the ``realtime`` materialization mode): reads a
# domain version's Kafka-compatible topic, diffs each source row's slots
# against the ``…_slots`` snapshot (``transformWithState``) and upserts the
# changes into the Lakebase ``g_<dom>_v<n>_live`` table the graph's union view
# reads. Code: ``src/jobs/triple_stream/main.py`` (+ ``processor.py``).
#
# Started per domain version by the app (``TwinRealtimeStream.start``) through
# ``jobs.run_now`` with ``job_parameters``; there is no schedule and no trigger,
# so the job is inert until a ``realtime`` domain is built with
# ``ONTOBRICKS_REALTIME_ENABLED=true``. DAB cannot include a resource
# conditionally, so ``var.realtime_enabled`` (default false) only tags the
# deployment; the app refuses to start a stream while its own setting is off.
#
# Classic compute on purpose: Real-Time Mode and ``transformWithState`` need a
# dedicated classic cluster (no serverless, no Photon, no autoscaling, no spot
# — a preempted worker would stall the stream). Real-Time Mode schedules every
# stage at once, so the workers' task slots (``var.realtime_num_workers`` × the
# node type's cores) must cover the topic's partitions plus
# ``var.realtime_shuffle_partitions`` (the stream's one shuffle, the
# ``transformWithState`` grouping); the defaults (2 × 4 cores, 4 shuffle
# partitions) fit a topic of up to 4 partitions.
#
# The job is cloud-neutral: ``var.realtime_node_type_id`` has no default and the
# cloud's on-demand attributes come from the target (``dev`` / ``dev-lakebase``
# and the generated ``dev-lakebase-<id>`` targets are AWS: ``i3.xlarge``,
# ``aws_attributes.availability: ON_DEMAND``); an Azure or GCP target sets its
# own node type (and ``azure_attributes`` / ``gcp_attributes``).
#
# The run-as identity is the deployer (the job owner). It needs READ on the
# domain's secret scope (source credentials, the Lakebase password), SELECT on
# the domain's ``…_slots`` table and READ VOLUME + WRITE VOLUME on the
# checkpoint volume (``ONTOBRICKS_REALTIME_CHECKPOINT_ROOT``), where the app
# also uploads each run's mappings (``_mappings/<run>.json``; the app principal
# needs WRITE VOLUME there and CAN_MANAGE_RUN on this job —
# ``scripts/bootstrap/app-permissions.sh``).
#
# One run at a time per deployment (``max_concurrent_runs: 1``): raise it to
# stream several domain versions at once. A failed run retries three times a
# minute apart; the run stays active meanwhile, so the scheduled tick does not
# retire ``_live``; past the retries it does, and readers fall back to the
# microbatch graph. DAB in development mode prefixes the name with
# ``[dev <user>] ``, which the app's lookup allows for.
#
# Live-unverified: Real-Time Mode (update mode, slot sizing),
# ``transformWithState``, the Kafka / Event Hubs / Kinesis connectors, the
# Postgres sink and the executors importing the synced source on the
# configured runtime.

resources:
  jobs:
    triple_rtm_job:
      name: "${var.app_name}-triple-rtm"
      description: "OntoBricks: realtime triple stream into Lakebase _live (one domain version per run)"

      email_notifications:
        on_failure:
          - "${workspace.current_user.userName}"

      max_concurrent_runs: 1

      tags:
        ontobricks_realtime_enabled: "${var.realtime_enabled}"

      job_clusters:
        - job_cluster_key: rtm
          new_cluster:
            spark_version: "${var.realtime_spark_version}"
            node_type_id: "${var.realtime_node_type_id}"
            num_workers: ${var.realtime_num_workers}
            runtime_engine: STANDARD
            data_security_mode: SINGLE_USER
            spark_env_vars:
              PYTHONPATH: "${workspace.file_path}/src"
            spark_conf:
              spark.databricks.streaming.realTimeMode.enabled: "true"
              # Few shuffle partitions: each one holds a task slot for the whole run.
              spark.sql.shuffle.partitions: "${var.realtime_shuffle_partitions}"
              # Small Arrow batches to the Python state processor: a record waits
              # less for its batch to fill (1 is the lowest latency, at a
              # throughput cost).
              spark.sql.execution.arrow.maxRecordsPerBatch: "100"
              # SparkColumnText prints timestamps in UTC, as the slot SQL reads them here.
              spark.sql.session.timeZone: "UTC"

      tasks:
        - task_key: stream
          job_cluster_key: rtm
          max_retries: 3
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          # No app wheel: the driver and the executors import ``back.core.streaming``
          # and ``jobs.triple_stream`` from the synced workspace files of the same
          # deploy (``PYTHONPATH`` on the cluster). That closure needs no app layer,
          # web stack, SPARQL parser or pydantic (tests/units/jobs/
          # test_triple_stream_closure.py) — only what the runtime ships plus the
          # two packages below. The runtime's pyarrow is never pinned or replaced.
          libraries:
            - pypi:
                package: "psycopg[binary]>=3.1"
            - pypi:
                package: "databricks-sql-connector>=4.4.0"
          spark_python_task:
            python_file: "${workspace.file_path}/src/jobs/triple_stream/main.py"
            # Supplied per run by TwinRealtimeStream through ``job_parameters``.
            parameters:
              - "--domain"
              - "{{job.parameters.domain}}"
              - "--version"
              - "{{job.parameters.version}}"
              - "--source-kind"
              - "{{job.parameters.source_kind}}"
              - "--bootstrap-servers"
              - "{{job.parameters.bootstrap_servers}}"
              - "--topic"
              - "{{job.parameters.topic}}"
              - "--secret-scope"
              - "{{job.parameters.secret_scope}}"
              - "--secret-key"
              - "{{job.parameters.secret_key}}"
              - "--slots-table"
              - "{{job.parameters.slots_table}}"
              - "--mappings-json-path"
              - "{{job.parameters.mappings_json_path}}"
              - "--lakebase-host"
              - "{{job.parameters.lakebase_host}}"
              - "--lakebase-db"
              - "{{job.parameters.lakebase_db}}"
              - "--lakebase-user"
              - "{{job.parameters.lakebase_user}}"
              - "--lakebase-secret"
              - "{{job.parameters.lakebase_secret}}"
              - "--live-table"
              - "{{job.parameters.live_table}}"
              - "--checkpoint"
              - "{{job.parameters.checkpoint}}"
              - "--state-ttl-hours"
              - "{{job.parameters.state_ttl_hours}}"

      parameters:
        - name: domain
          default: ""
        - name: version
          default: ""
        - name: source_kind
          default: "kafka"
        - name: bootstrap_servers
          default: ""
        - name: topic
          default: ""
        - name: secret_scope
          default: ""
        - name: secret_key
          default: ""
        - name: slots_table
          default: ""
        - name: mappings_json_path
          default: ""
        - name: lakebase_host
          default: ""
        - name: lakebase_db
          default: ""
        - name: lakebase_user
          default: ""
        - name: lakebase_secret
          default: ""
        - name: live_table
          default: ""
        - name: checkpoint
          default: ""
        - name: state_ttl_hours
          default: "72"
